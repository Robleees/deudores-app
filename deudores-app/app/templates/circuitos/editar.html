{% extends 'base.html' %}

{% block title %}Editar {{ circuito.nombre }} — Gestor de Deudas{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-6">

    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a href="{{ url_for('circuitos.index') }}">Circuitos</a>
        </li>
        <li class="breadcrumb-item">
          <a href="{{ url_for('circuitos.detalle', circuito_id=circuito.id) }}">{{ circuito.nombre }}</a>
        </li>
        <li class="breadcrumb-item active">Editar</li>
      </ol>
    </nav>

    <div class="card shadow-sm">
      <div class="card-header fw-semibold">Editar circuito</div>
      <div class="card-body p-4">

        <form method="post" action="{{ url_for('circuitos.editar', circuito_id=circuito.id) }}" novalidate>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              class="form-control"
              value="{{ request.form.get('nombre', circuito.nombre) }}"
              maxlength="100"
              required
              autofocus
            >
          </div>

          <div class="mb-4">
            <label for="descripcion" class="form-label">
              Descripción <span class="text-muted small">(opcional)</span>
            </label>
            <textarea
              id="descripcion"
              name="descripcion"
              class="form-control"
              rows="3"
              maxlength="255"
            >{{ request.form.get('descripcion', circuito.descripcion or '') }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">Guardar cambios</button>
            <a
              href="{{ url_for('circuitos.detalle', circuito_id=circuito.id) }}"
              class="btn btn-outline-secondary"
            >Cancelar</a>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
